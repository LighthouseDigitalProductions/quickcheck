<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickCheck Editor Sign-Up</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <p style="font-family:sans-serif;padding:24px">Setting up your editor login&hellip;</p>
  <script>
    netlifyIdentity.init({
      APIUrl: "https://mtd-quickcheck-editor.netlify.app/.netlify/identity"
    });
    netlifyIdentity.on("login", function () {
      document.location.href = "/admin/";
    });
  </script>
</body>
</html>
