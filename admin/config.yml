backend:
  # Netlify Identity + Git Gateway: Martin logs in with a simple email/password
  # (set up via a free Netlify account connected to this same repo). No GitHub
  # account needed for him, and no separate OAuth proxy server to run.
  name: git-gateway
  branch: main

# Changes Martin saves become a pull request for review, instead of
# publishing straight to the live site.
publish_mode: editorial_workflow

# Required by Decap CMS even though this editor doesn't use image uploads.
media_folder: "assets/uploads"

collections:
  - name: "questions"
    label: "QuickCheck Questions"
    files:
      - file: "questions.json"
        label: "10 Behavior Questions"
        name: "questions"
        description: "Edit the text for each of the 10 QuickCheck questions. The order here is the order they appear in the quiz."
        fields:
          - label: "Questions"
            name: "questions"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title (keep the leading number, e.g. '1. Timely Injury Reporting')", name: "title", widget: "string" }
              - { label: "Question text (shown during the quiz)", name: "text", widget: "text" }
              - { label: "How this gets validated (shown in the final report)", name: "validation", widget: "text" }
              - { label: "How to improve (shown in the final report)", name: "improve", widget: "text" }

  - name: "site_content"
    label: "Site Text"
    files:
      - file: "site-content.json"
        label: "Page Wording"
        name: "site_content"
        description: "Edit the wording on the intro page, the thank-you page, and the labels on the Snapshot Report. Note: the Snapshot Report's Executive Summary, Patterns, Interpretation, Follow-Up, and Closing sections are NOT here — those are written automatically from each person's quiz answers and can't be edited directly."
        fields:
          - label: "Quiz Answer Scale (used for every question)"
            name: "scale"
            widget: "object"
            hint: "The 5 choices shown for every question, from the most-consistently-practiced to the least. Don't reorder these fields — each one is tied to its point value."
            fields:
              - { label: "Highest (5 points)", name: "pts_5", widget: "string" }
              - { label: "4 points", name: "pts_4", widget: "string" }
              - { label: "3 points", name: "pts_3", widget: "string" }
              - { label: "2 points", name: "pts_2", widget: "string" }
              - { label: "Lowest (1 point)", name: "pts_1", widget: "string" }
          - label: "Report Rating-Tier Labels"
            name: "tiers"
            widget: "object"
            hint: "The short label shown next to each score (1-5) in the report's score table. Don't reorder these fields — each one is tied to its point value."
            fields:
              - { label: "Highest (5 points)", name: "pts_5", widget: "string" }
              - { label: "4 points", name: "pts_4", widget: "string" }
              - { label: "3 points", name: "pts_3", widget: "string" }
              - { label: "2 points", name: "pts_2", widget: "string" }
              - { label: "Lowest (1 point)", name: "pts_1", widget: "string" }
          - label: "Header & Footer (shown on every page)"
            name: "global"
            widget: "object"
            fields:
              - { label: "Company name (header)", name: "brand_name", widget: "string" }
              - { label: "Tagline under company name (header)", name: "brand_tagline", widget: "string" }
              - { label: "Small subtitle next to the logo (header)", name: "header_subtitle", widget: "string" }
              - { label: "Footer copyright line", name: "footer_copyright", widget: "string" }
              - { label: "Footer trademark line", name: "footer_trademark", widget: "string" }
          - label: "Intro Page"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Page title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "lede_1", widget: "text" }
              - { label: "Paragraph 2", name: "lede_2", widget: "text" }
              - { label: "Instructions", name: "instructions", widget: "text" }
              - { label: "Estimated time line", name: "estimated_time", widget: "string" }
              - { label: "\"Start\" button text", name: "start_button", widget: "string" }
              - { label: "Disclaimer", name: "disclaimer", widget: "text" }
              - { label: "\"Respondent Information\" section label", name: "respondent_label", widget: "string" }
              - { label: "\"Organization\" field label", name: "label_org", widget: "string" }
              - { label: "\"Respondent Name\" field label", name: "label_name", widget: "string" }
              - { label: "\"Role or Department\" field label", name: "label_role", widget: "string" }
              - { label: "\"Industry\" field label", name: "label_industry", widget: "string" }
              - { label: "\"Approximate Number of Employees\" field label", name: "label_employees", widget: "string" }
          - label: "Quiz Screen"
            name: "quiz"
            widget: "object"
            fields:
              - { label: "\"Back\" button text", name: "back_button", widget: "string" }
          - label: "Thank You Page"
            name: "thankyou"
            widget: "object"
            fields:
              - { label: "Page title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string" }
              - { label: "Intro paragraph", name: "lede", widget: "text" }
              - { label: "\"What You'll Receive\" section label", name: "receive_label", widget: "string" }
              - { label: "\"What You'll Receive\" intro line", name: "receive_intro", widget: "string" }
              - label: "\"What You'll Receive\" checklist items"
                name: "receive_items"
                widget: "list"
                field: { label: "Item", name: "item", widget: "string" }
              - { label: "\"Rating Categories\" section label", name: "categories_label", widget: "string" }
              - { label: "\"Rating Categories\" intro line", name: "categories_intro", widget: "string" }
              - label: "Rating category cards"
                name: "categories"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Category name", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "\"Show my Snapshot Report\" button text", name: "report_button", widget: "string" }
              - { label: "Disclaimer", name: "disclaimer", widget: "text" }
          - label: "Snapshot Report — Static Labels Only"
            name: "report"
            widget: "object"
            fields:
              - { label: "Header kicker (small text above the title)", name: "kicker", widget: "string" }
              - { label: "Header title", name: "title", widget: "string" }
              - { label: "\"Print / Save as PDF\" button text", name: "print_button", widget: "string" }
              - { label: "\"Completed by\" label", name: "meta_completed_by", widget: "string" }
              - { label: "\"Assessment date\" label", name: "meta_assessment_date", widget: "string" }
              - { label: "\"Report basis\" line", name: "report_basis", widget: "string" }
              - { label: "Section heading: Executive Summary", name: "heading_exec_summary", widget: "string" }
              - { label: "Section heading: Score Profile", name: "heading_score_profile", widget: "string" }
              - { label: "Score table column 1 header", name: "score_table_col1", widget: "string" }
              - { label: "Score table column 2 header", name: "score_table_col2", widget: "string" }
              - { label: "Section heading: Notable Patterns", name: "heading_patterns", widget: "string" }
              - { label: "Section heading: Interpretation of Results", name: "heading_interpretation", widget: "string" }
              - { label: "Section heading: Validate Ratings", name: "heading_validate", widget: "string" }
              - { label: "Section 4 intro line", name: "validate_intro", widget: "text" }
              - { label: "Validation table column 1 header", name: "validation_table_col1", widget: "string" }
              - { label: "Validation table column 2 header", name: "validation_table_col2", widget: "string" }
              - { label: "Section heading: Priority Follow-Up", name: "heading_followup", widget: "string" }
              - { label: "Section heading: Closing Assessment", name: "heading_closing", widget: "string" }
              - { label: "Booking form: Email field label", name: "contact_email_label", widget: "string" }
              - { label: "Booking form: Phone field label", name: "contact_phone_label", widget: "string" }
              - { label: "Booking form: State field label", name: "contact_state_label", widget: "string" }
              - { label: "Booking form: Renewal month field label", name: "contact_renewal_label", widget: "string" }
              - { label: "Booking form: Interest field label", name: "contact_interest_label", widget: "string" }
              - { label: "Booking box heading", name: "booking_heading", widget: "string" }
              - { label: "Booking box subtext", name: "booking_sub", widget: "string" }
              - { label: "Booking button text", name: "booking_button", widget: "string" }
