backend:
  # Netlify Identity + Git Gateway: Martin logs in with a simple email/password
  # (set up via a free Netlify account connected to this same repo). No GitHub
  # account needed for him, and no separate OAuth proxy server to run.
  name: git-gateway
  branch: main

# Changes Martin saves become a pull request for review, instead of
# publishing straight to the live site.
publish_mode: editorial_workflow

# Required by Decap CMS even though this editor doesn't use image uploads.
media_folder: "assets/uploads"

collections:
  - name: "questions"
    label: "QuickCheck Questions"
    files:
      - file: "questions.json"
        label: "10 Behavior Questions"
        name: "questions"
        description: "Edit the text for each of the 10 QuickCheck questions. The order here is the order they appear in the quiz."
        fields:
          - label: "Questions"
            name: "questions"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title (keep the leading number, e.g. '1. Timely Injury Reporting')", name: "title", widget: "string" }
              - { label: "Question text (shown during the quiz)", name: "text", widget: "text" }
              - { label: "Why this may matter (shown in the Snapshot when this is the area to examine)", name: "implication", widget: "text" }
              - { label: "Question worth exploring (shown in the Snapshot when this is the area to examine)", name: "prompt", widget: "text" }
              - { label: "Validation measure (not currently shown online)", name: "validation", widget: "text" }
              - { label: "How to improve (not currently shown online)", name: "improve", widget: "text" }

  - name: "site_content"
    label: "Site Text"
    files:
      - file: "site-content.json"
        label: "Page Wording"
        name: "site_content"
        description: "Edit the wording on the intro page, the preliminary Snapshot, and the scoring bands. Which pattern, strength and area a person sees is chosen automatically from their answers by fixed rules; here you edit the words shown and the cut-off numbers. Each behavior's 'why this may matter' sentence and follow-up question are edited under QuickCheck Questions."
        fields:
          - label: "Quiz Answer Scale (used for every question)"
            name: "scale"
            widget: "object"
            hint: "The 5 choices shown for every question, from the most-consistently-practiced to the least. Don't reorder these fields — each one is tied to its point value."
            fields:
              - { label: "Highest (5 points)", name: "pts_5", widget: "string" }
              - { label: "4 points", name: "pts_4", widget: "string" }
              - { label: "3 points", name: "pts_3", widget: "string" }
              - { label: "2 points", name: "pts_2", widget: "string" }
              - { label: "Lowest (1 point)", name: "pts_1", widget: "string" }
          - label: "Header & Footer (shown on every page)"
            name: "global"
            widget: "object"
            fields:
              - { label: "Small subtitle next to the logo (header)", name: "header_subtitle", widget: "string" }
              - { label: "Footer copyright line", name: "footer_copyright", widget: "string" }
              - { label: "Footer trademark line", name: "footer_trademark", widget: "string" }
          - label: "Intro Page"
            name: "intro"
            widget: "object"
            fields:
              - { label: "Page title", name: "title", widget: "string" }
              - { label: "Paragraph 1", name: "lede_1", widget: "text" }
              - { label: "Paragraph 2", name: "lede_2", widget: "text" }
              - { label: "Instructions", name: "instructions", widget: "text" }
              - { label: "Estimated time line", name: "estimated_time", widget: "string" }
              - { label: "\"Start\" button text", name: "start_button", widget: "string" }
              - { label: "Disclaimer", name: "disclaimer", widget: "text" }
              - { label: "\"Respondent Information\" section label", name: "respondent_label", widget: "string" }
              - { label: "\"Organization\" field label", name: "label_org", widget: "string" }
              - { label: "\"Respondent Name\" field label", name: "label_name", widget: "string" }
              - { label: "\"Role or Department\" field label", name: "label_role", widget: "string" }
              - { label: "\"Industry\" field label", name: "label_industry", widget: "string" }
              - { label: "\"Approximate Number of Employees\" field label", name: "label_employees", widget: "string" }
          - label: "Quiz Screen"
            name: "quiz"
            widget: "object"
            fields:
              - { label: "\"Back\" button text", name: "back_button", widget: "string" }
          - label: "Scoring Bands (cut-off numbers)"
            name: "scoring"
            widget: "object"
            hint: "Average of the ten 1–5 ratings decides the overall pattern. Numbers must be between 1 and 5, and Strong ≥ Developing ≥ Several; otherwise the built-in defaults (4.5 / 3.5 / 2.5, minimums 3 / 2) are used. Changing these is a rule change — check with Lighthouse first."
            fields:
              - { label: "Strong: minimum average", name: "strong_avg", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
              - { label: "Strong: no single rating below", name: "strong_min", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
              - { label: "Developing: minimum average", name: "developing_avg", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
              - { label: "Developing: no single rating below", name: "developing_min", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
              - { label: "Several practices to strengthen: minimum average", name: "several_avg", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1 }
          - label: "Preliminary Snapshot"
            name: "snapshot"
            widget: "object"
            fields:
              - { label: "Page title", name: "title", widget: "string" }
              - { label: "Intro to the overall pattern (before the pattern name)", name: "pattern_intro", widget: "string" }
              - { label: "Pattern name: Strong", name: "pattern_strong", widget: "string" }
              - { label: "Pattern name: Developing", name: "pattern_developing", widget: "string" }
              - { label: "Pattern name: Several practices", name: "pattern_several", widget: "string" }
              - { label: "Pattern name: Foundational", name: "pattern_foundational", widget: "string" }
              - { label: "Label: reported strength", name: "strength_label", widget: "string" }
              - { label: "Label: area to examine", name: "area_label", widget: "string" }
              - { label: "Label: area to examine when all ten are rated 4 or 5", name: "area_label_validate", widget: "string" }
              - { label: "Line format for a selected behavior (keep {behavior} and {answer})", name: "selected_line", widget: "string" }
              - { label: "Label: why this may matter", name: "why_label", widget: "string" }
              - { label: "Why-it-matters text when all ten are rated 4 or 5", name: "why_all_high", widget: "text" }
              - { label: "Label: question worth exploring", name: "question_label", widget: "string" }
              - { label: "Note when no practice is rated 4 or higher", name: "no_strength_note", widget: "text" }
              - { label: "Note when all ten answers are the same", name: "equal_note", widget: "text" }
              - { label: "Label: practice used as an example (all answers the same)", name: "equal_example_label", widget: "string" }
              - { label: "Next-step line when all answers are the same", name: "equal_next", widget: "text" }
              - { label: "Closing paragraph", name: "closing", widget: "text" }
              - { label: "Disclaimer", name: "disclaimer", widget: "text" }
              - { label: "Booking box heading", name: "booking_heading", widget: "string" }
              - { label: "Booking box subtext", name: "booking_sub", widget: "text" }
              - { label: "Booking button text", name: "booking_button", widget: "string" }
              - { label: "Email: heading above the ratings list", name: "email_ratings_heading", widget: "string" }
              - { label: "Email: note under that heading", name: "email_ratings_note", widget: "text" }
          - label: "Results-Ready Step (asks for email and phone before the Snapshot)"
            name: "gate"
            widget: "object"
            fields:
              - { label: "Small heading above the title", name: "kicker", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Intro text", name: "sub", widget: "text" }
              - { label: "Email label", name: "email_label", widget: "string" }
              - { label: "Phone label", name: "phone_label", widget: "string" }
              - { label: "Note above the optional fields", name: "optional_note", widget: "string" }
              - { label: "State label", name: "state_label", widget: "string" }
              - { label: "Renewal month label", name: "renewal_label", widget: "string" }
              - { label: "Interest label", name: "interest_label", widget: "string" }
              - { label: "Button text", name: "button", widget: "string" }
              - { label: "Small privacy line under the button", name: "privacy", widget: "string" }
