<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost Control Behaviors™ QuickCheck | MTD Strategic Insurance Solutions</title>
<meta name="description" content="A short assessment of the operational behaviors driving your workers' compensation costs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0B5C2A; --green:#138E40; --green-pale:#E7F3EA;
    --ink:#17211C; --ink-soft:#4B564F; --paper:#FBFAF6; --card:#FFFFFF;
    --line:#DDE3DC; --gold:#B8862E; --danger:#A6412E; --radius:4px;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px; margin:0 auto; padding:0 20px;}
  header.site{border-bottom:1px solid var(--line); background:var(--card);}
  header.site .wrap{display:flex; align-items:center; justify-content:space-between; padding:18px 20px;}
  .header-logo{display:block; height:40px; width:auto;}
  main{padding:44px 0 80px;}
  h1.page-title{font-family:var(--serif); font-size:1.9rem; line-height:1.2; margin:0 0 6px; color:var(--ink);}
  h2.page-sub{font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--green-deep); margin:0 0 22px;}
  p.lede{font-size:1rem; color:var(--ink-soft); max-width:60ch; margin:0 0 16px;}
  .btn{appearance:none; border:none; cursor:pointer; font-family:var(--sans); font-weight:600; font-size:.98rem; padding:14px 26px; border-radius:var(--radius); transition:background .15s ease;}
  .btn-primary{background:var(--green-deep); color:#fff;}
  .btn-primary:hover{background:var(--green);}
  .btn-ghost{background:transparent; color:var(--green-deep); border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--green-deep);}
  .disclaimer{font-size:.78rem; color:var(--ink-soft); margin-top:26px; padding-top:18px; border-top:1px dashed var(--line); max-width:60ch;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px;}

  /* Intro / respondent form */
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}
  label{display:block; font-size:.78rem; font-weight:600; color:var(--ink); margin-bottom:5px;}
  input, select, textarea{width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:var(--radius); font-family:var(--sans); font-size:.92rem; background:#fff; color:var(--ink);}
  input:focus, select:focus, textarea:focus{outline:2px solid var(--green); outline-offset:1px;}
  .full{grid-column:1 / -1;}
  .section-label{font-family:var(--serif); font-size:1rem; font-weight:600; color:var(--ink); margin:26px 0 14px; padding-top:18px; border-top:1px solid var(--line);}
  .section-label:first-of-type{border-top:none; padding-top:0; margin-top:8px;}

  /* Quiz */
  .progress-track{height:5px; background:var(--green-pale); border-radius:3px; overflow:hidden; margin-bottom:10px;}
  .progress-fill{height:100%; background:var(--green); width:0%; transition:width .35s ease;}
  .progress-label{font-size:.78rem; color:var(--ink-soft); margin-bottom:26px;}
  .q-eyebrow{font-size:.8rem; font-weight:600; color:var(--green-deep); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .q-text{font-family:var(--serif); font-size:1.3rem; line-height:1.35; margin:0 0 24px; color:var(--ink);}
  .choices{display:flex; flex-direction:column; gap:10px; margin-bottom:28px;}
  .choice{text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; font-family:var(--sans); font-size:.96rem; color:var(--ink); cursor:pointer; transition:border-color .12s ease, background .12s ease;}
  .choice:hover{border-color:var(--green); background:#F4FAF5;}
  .choice.selected{border-color:var(--green-deep); background:var(--green-pale); font-weight:600;}
  .quiz-nav{display:flex; justify-content:space-between; align-items:center;}

  /* Preliminary Snapshot */
  .snap-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:32px; margin-bottom:8px;}
  .snap-pattern{background:var(--green-pale); border-radius:var(--radius); padding:18px 20px; margin-bottom:22px;}
  .snap-pattern .snap-label{text-transform:none; font-size:.9rem; letter-spacing:0; color:var(--green-deep);}
  .snap-pattern-name{font-family:var(--serif); font-size:1.45rem; font-weight:700; color:var(--green-deep); margin-top:4px; line-height:1.25;}
  .snap-block{margin-bottom:20px;}
  .snap-label{font-size:.78rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:4px;}
  .snap-text{font-size:1rem; color:var(--ink);}
  .snap-note{font-size:.95rem; color:var(--ink-soft); margin:0 0 20px;}
  .snap-closing{font-size:.95rem; color:var(--ink-soft); margin:26px 0 0; padding-top:18px; border-top:1px dashed var(--line);}
  .snap-cta{text-align:center; margin-top:28px; padding:28px; background:var(--green-pale); border-radius:var(--radius);}
  .snap-cta-heading{font-family:var(--serif); font-size:1.1rem; color:var(--ink); margin:0 0 4px;}
  .snap-cta-sub{font-size:.9rem; color:var(--ink-soft); margin:0 0 18px;}
  .gate-card{margin-top:0; padding:34px 28px;}
  .gate-kicker{font-size:.8rem; font-weight:600; letter-spacing:.03em; text-transform:uppercase; color:var(--green-deep); margin:0 0 6px;}
  .gate-optional{font-size:.85rem; color:var(--ink-soft); margin:18px 0 0;}
  .gate-privacy{font-size:.78rem; color:var(--ink-soft); text-align:center; margin:12px 0 0;}

  .screen{display:none;}
  .screen.active{display:block;}

  footer.site{border-top:1px solid var(--line); padding:26px 0; margin-top:40px;}
  footer.site .wrap{font-size:.78rem; color:var(--ink-soft); display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  :focus-visible{outline:2px solid var(--green-deep); outline-offset:2px;}
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <img src="assets/mtd-logo.png" alt="MTD Strategic Insurance Solutions" class="header-logo">
    <div style="font-size:.8rem; color:var(--ink-soft);" id="scHeaderSubtitle">Cost Control Behaviors™ QuickCheck</div>
  </div>
</header>

<main>
  <div class="wrap">

    <!-- ============ SCREEN 1: INTRO / RESPONDENT INFO (PDF page 1) ============ -->
    <section id="screen-intro" class="screen active">
      <h1 class="page-title" id="scIntroTitle"></h1>
      <p class="lede" id="scIntroLede1"></p>
      <p class="lede" id="scIntroLede2"></p>

      <div class="section-label">Instructions</div>
      <p class="lede" id="scIntroInstructions"></p>
      <p class="lede" style="font-weight:600; color:var(--ink);" id="scIntroEstTime"></p>

      <div class="section-label" id="scIntroRespondentLabel"></div>
      <form id="respondentForm" onsubmit="return startQuiz(event)">
        <div class="field-row">
          <div><label for="r_org" id="scIntroLabelOrg"></label><input id="r_org" required></div>
          <div><label for="r_name" id="scIntroLabelName"></label><input id="r_name" required></div>
        </div>
        <div class="field-row">
          <div><label for="r_role" id="scIntroLabelRole"></label><input id="r_role" required></div>
          <div><label for="r_industry" id="scIntroLabelIndustry"></label><input id="r_industry" required></div>
        </div>
        <div class="field-row">
          <div class="full"><label for="r_employees" id="scIntroLabelEmployees"></label><input id="r_employees" type="number" min="1" required></div>
        </div>
        <button class="btn btn-primary" type="submit" style="margin-top:10px;" id="scIntroStartBtn"></button>
      </form>

      <p class="disclaimer" id="scIntroDisclaimer"></p>
    </section>

    <!-- ============ SCREEN 2: QUIZ ============ -->
    <section id="screen-quiz" class="screen">
      <div class="card">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-label" id="progressLabel">Question 1 of 10</div>
        <div class="q-eyebrow" id="qTitle"></div>
        <p class="q-text" id="qText"></p>
        <div class="choices" id="qChoices"></div>
        <div class="quiz-nav">
          <button class="btn btn-ghost" id="backBtn" onclick="prevQ()"></button>
          <span></span>
        </div>
      </div>
    </section>

    <!-- ============ SCREEN 3: RESULTS-READY STEP (email + phone) ============ -->
    <section id="screen-gate" class="screen">
      <div class="snap-cta gate-card">
        <p class="gate-kicker" id="scGateKicker"></p>
        <h1 class="page-title" id="scGateTitle" style="margin-bottom:6px;"></h1>
        <p class="snap-cta-sub" id="scGateSub"></p>
        <form id="contactForm" onsubmit="return submitGate(event)" style="text-align:left; max-width:480px; margin:0 auto;">
          <div class="field-row">
            <div><label for="c_email" id="scGateLabelEmail"></label><input id="c_email" type="email" required></div>
            <div><label for="c_phone" id="scGateLabelPhone"></label><input id="c_phone" type="tel" inputmode="numeric" maxlength="14" placeholder="(555) 555-5555" required pattern="\(\d{3}\) \d{3}-\d{4}" title="Enter a 10-digit phone number, e.g. (555) 555-5555" oninput="this.setCustomValidity(''); formatPhoneInput(this)"></div>
          </div>
          <p class="gate-optional" id="scGateOptionalNote"></p>
          <div class="field-row">
            <div><label for="c_state" id="scGateLabelState"></label>
              <select id="c_state">
                <option value="">Select…</option>
                <option value="AL">AL</option><option value="AK">AK</option><option value="AZ">AZ</option><option value="AR">AR</option>
                <option value="CA">CA</option><option value="CO">CO</option><option value="CT">CT</option><option value="DE">DE</option>
                <option value="DC">DC</option><option value="FL">FL</option><option value="GA">GA</option><option value="HI">HI</option>
                <option value="ID">ID</option><option value="IL">IL</option><option value="IN">IN</option><option value="IA">IA</option>
                <option value="KS">KS</option><option value="KY">KY</option><option value="LA">LA</option><option value="ME">ME</option>
                <option value="MD">MD</option><option value="MA">MA</option><option value="MI">MI</option><option value="MN">MN</option>
                <option value="MS">MS</option><option value="MO">MO</option><option value="MT">MT</option><option value="NE">NE</option>
                <option value="NV">NV</option><option value="NH">NH</option><option value="NJ">NJ</option><option value="NM">NM</option>
                <option value="NY">NY</option><option value="NC">NC</option><option value="ND">ND</option><option value="OH">OH</option>
                <option value="OK">OK</option><option value="OR">OR</option><option value="PA">PA</option><option value="RI">RI</option>
                <option value="SC">SC</option><option value="SD">SD</option><option value="TN">TN</option><option value="TX">TX</option>
                <option value="UT">UT</option><option value="VT">VT</option><option value="VA">VA</option><option value="WA">WA</option>
                <option value="WV">WV</option><option value="WI">WI</option><option value="WY">WY</option>
                <option value="AS">AS</option><option value="GU">GU</option><option value="MP">MP</option><option value="PR">PR</option><option value="VI">VI</option>
              </select>
            </div>
            <div><label for="c_renewal" id="scGateLabelRenewal"></label>
              <select id="c_renewal">
                <option value="">Select…</option>
                <option>January</option><option>February</option><option>March</option><option>April</option>
                <option>May</option><option>June</option><option>July</option><option>August</option>
                <option>September</option><option>October</option><option>November</option><option>December</option>
              </select>
            </div>
          </div>
          <div class="field-row">
            <div class="full">
              <label for="c_interest" id="scGateLabelInterest"></label>
              <select id="c_interest">
                <option value="">Select one…</option>
                <option>Advisory support</option>
                <option>An insurance review</option>
                <option>Both</option>
                <option>Just my results for now</option>
              </select>
            </div>
          </div>
          <div style="text-align:center; margin-top:14px;">
            <button class="btn btn-primary" type="submit" id="scGateBtn"></button>
          </div>
          <p class="gate-privacy" id="scGatePrivacy"></p>
        </form>
      </div>
    </section>

    <!-- ============ SCREEN 4: PRELIMINARY SNAPSHOT ============ -->
    <section id="screen-snapshot" class="screen">
      <h1 class="page-title" id="scSnapTitle"></h1>
      <div class="snap-card">
        <div id="snapBody"></div>
        <p class="snap-closing" id="scSnapClosing"></p>
      </div>
      <p class="disclaimer" id="scSnapDisclaimer"></p>

      <div class="snap-cta" id="snapBookingBox">
        <p class="snap-cta-heading" id="scSnapBookingHeading"></p>
        <p class="snap-cta-sub" id="scSnapBookingSub"></p>
        <button class="btn btn-primary" type="button" onclick="bookConversation()" id="scSnapBookingBtn"></button>
      </div>
    </section>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span id="scFooterCopyright"></span>
    <span id="scFooterTrademark"></span>
  </div>
</footer>

<script>
/* =========================================================================
   CONFIG — edit questions, scale labels, or per-behavior copy here.
   No other part of the file needs to change when content is updated.
   ========================================================================= */

const SCALE = [
  { label:"Consistently", pts:5 },
  { label:"Usually",      pts:4 },
  { label:"Sometimes",    pts:3 },
  { label:"Rarely",       pts:2 },
  { label:"Not in Place", pts:1 },
];

/* The 10 quiz questions live in questions.json, not here — that keeps
   them editable through the /admin content editor without touching code.
   This fetch kicks off as soon as the page loads; startQuiz() awaits it
   before the quiz needs the data. */
let QUESTIONS = [];
const questionsReady = fetch('questions.json')
  .then(r => r.json())
  .then(data => { QUESTIONS = data.questions; })
  .catch(err => { console.error('Failed to load questions.json:', err); });

/* All other on-page copy (the intro page, the wording of the preliminary
   Snapshot, and the scoring bands) lives in site-content.json for the same
   reason — editable through /admin without touching code. The rules that
   decide WHICH Snapshot wording a given set of answers produces live in
   computeSnapshot() below; each behavior's "why this may matter" sentence and
   follow-up question live in questions.json. */
const siteContentReady = fetch('site-content.json')
  .then(r => r.json())
  .then(data => { populateSiteContent(data); })
  .catch(err => { console.error('Failed to load site-content.json:', err); });

let SITE_CONTENT = {};

function populateSiteContent(c){
  SITE_CONTENT = c; // stashed so the Snapshot code can reach snapshot.* and scoring.*
  const setText = (id, val) => { const el = document.getElementById(id); if (el && val != null) el.textContent = val; };

  // Quiz answer-choice wording (Consistently/Usually/.../Not in Place).
  // Keyed by point value (pts_5..pts_1) rather than list position, so there
  // is nothing to accidentally drag-reorder in the editor and silently
  // scramble the scoring — only the label text itself is editable.
  const scale = c.scale || {};
  SCALE.forEach(s => { const v = scale['pts_' + s.pts]; if (v) s.label = v; });

  const global = c.global || {};
  setText('scHeaderSubtitle', global.header_subtitle);
  setText('scFooterCopyright', global.footer_copyright);
  setText('scFooterTrademark', global.footer_trademark);

  const quiz = c.quiz || {};
  setText('backBtn', quiz.back_button);

  const intro = c.intro || {};
  setText('scIntroTitle', intro.title);
  setText('scIntroLede1', intro.lede_1);
  setText('scIntroLede2', intro.lede_2);
  setText('scIntroInstructions', intro.instructions);
  setText('scIntroEstTime', intro.estimated_time);
  setText('scIntroStartBtn', intro.start_button);
  setText('scIntroDisclaimer', intro.disclaimer);
  setText('scIntroRespondentLabel', intro.respondent_label);
  setText('scIntroLabelOrg', intro.label_org);
  setText('scIntroLabelName', intro.label_name);
  setText('scIntroLabelRole', intro.label_role);
  setText('scIntroLabelIndustry', intro.label_industry);
  setText('scIntroLabelEmployees', intro.label_employees);

  // Static parts of the Snapshot screen. The result itself (pattern, strength,
  // area, question) is built per respondent by renderSnapshot().
  const snap = c.snapshot || {};
  setText('scSnapTitle', snap.title);
  setText('scSnapClosing', snap.closing);
  setText('scSnapDisclaimer', snap.disclaimer);
  setText('scSnapBookingHeading', snap.booking_heading);
  setText('scSnapBookingSub', snap.booking_sub);
  setText('scSnapBookingBtn', snap.booking_button);
  // Hide the scheduling box until a real scheduling link has been set.
  const box = document.getElementById('snapBookingBox');
  if (box) box.style.display = BOOKING_URL ? '' : 'none';

  // Results-ready step shown right after question 10 (collects email + phone).
  const gate = c.gate || {};
  setText('scGateKicker', gate.kicker);
  setText('scGateTitle', gate.title);
  setText('scGateSub', gate.sub);
  setText('scGateLabelEmail', gate.email_label);
  setText('scGateLabelPhone', gate.phone_label);
  setText('scGateOptionalNote', gate.optional_note);
  setText('scGateLabelState', gate.state_label);
  setText('scGateLabelRenewal', gate.renewal_label);
  setText('scGateLabelInterest', gate.interest_label);
  setText('scGateBtn', gate.button);
  setText('scGatePrivacy', gate.privacy);
}

/* Where lead submissions get sent — paste the "Catch Hook" webhook URL
   from the Make scenario here once it's built. Leaving
   this unset simply skips sending; the booking link still works. */
const LEAD_ENDPOINT = "https://hook.us2.make.com/kyy63j516sqo8mn1oo3mcguquudgfn8m";

/* Where the "Schedule a Strategy Conversation" button on the Snapshot goes.
   Temporarily Calendly, for testing; swap in MTD's own scheduling link once
   chosen. If this is blank the scheduling box on the Snapshot is hidden. */
const BOOKING_URL = "https://calendly.com/sacredplans/30min";

/* ===================== app logic — no edits needed below ===================== */

let current = 0;
let answers = [];
let respondent = {};
let completionId = '';
let snapshotResult = null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

async function startQuiz(e){
  e.preventDefault();
  respondent = {
    org: document.getElementById('r_org').value,
    name: document.getElementById('r_name').value,
    role: document.getElementById('r_role').value,
    industry: document.getElementById('r_industry').value,
    employees: document.getElementById('r_employees').value,
    date: new Date().toLocaleDateString('en-CA'), // YYYY-MM-DD in local time
  };
  await questionsReady; // make sure questions.json has loaded
  await siteContentReady; // make sure scale labels have loaded too
  answers = new Array(QUESTIONS.length).fill(null);
  showScreen('screen-quiz');
  renderQ();
  return false;
}

function renderQ(){
  const q = QUESTIONS[current];
  document.getElementById('qTitle').textContent = q.title;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressLabel').textContent = `Question ${current+1} of ${QUESTIONS.length}`;
  document.getElementById('progressFill').style.width = `${(current/QUESTIONS.length)*100}%`;
  document.getElementById('backBtn').style.visibility = current === 0 ? 'hidden' : 'visible';

  const box = document.getElementById('qChoices');
  box.innerHTML = '';
  SCALE.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice' + (answers[current] === i ? ' selected' : '');
    b.textContent = c.label;
    b.onclick = () => selectChoice(i);
    box.appendChild(b);
  });
}

function selectChoice(i){
  answers[current] = i;
  if (current < QUESTIONS.length - 1){
    current++;
    renderQ();
  } else {
    document.getElementById('progressFill').style.width = '100%';
    completionId = newId();
    snapshotResult = computeSnapshot(currentPts());
    showScreen('screen-gate');
  }
}

function prevQ(){
  if (current > 0){ current--; renderQ(); }
}

function formatPhoneInput(input){
  const digits = input.value.replace(/\D/g, '').slice(0, 10);
  let formatted = digits;
  if (digits.length > 6){
    formatted = `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6,10)}`;
  } else if (digits.length > 3){
    formatted = `(${digits.slice(0,3)}) ${digits.slice(3,6)}`;
  } else if (digits.length > 0){
    formatted = `(${digits}`;
  }
  input.value = formatted;
}

async function submitGate(e){
  e.preventDefault();
  const phone = document.getElementById('c_phone');
  if (phone.value.replace(/\D/g, '').length !== 10){
    phone.setCustomValidity('Enter a 10-digit phone number, e.g. (555) 555-5555');
    phone.reportValidity();
    return false;
  }
  const btn = document.getElementById('scGateBtn');
  btn.disabled = true; // guard against double-submits while the lead POST is in flight

  respondent.email = document.getElementById('c_email').value;
  respondent.phone = phone.value;
  respondent.state = document.getElementById('c_state').value;
  respondent.renewal_month = document.getElementById('c_renewal').value;
  respondent.interest = document.getElementById('c_interest').value;

  // Wait for the lead POST to finish (bounded by a short timeout) before
  // moving on, so the request is not cut off mid-flight.
  renderSnapshot();
  await sendLeadAndWait();
  showScreen('screen-snapshot');
  return false;
}

function bookConversation(){
  if (BOOKING_URL) location.href = BOOKING_URL;
}

function sendLeadAndWait(){
  const leadPromise = sendLead();
  const timeout = new Promise(resolve => setTimeout(resolve, 2500));
  return Promise.race([leadPromise, timeout]);
}

/* ===================== preliminary Snapshot ===================== */

const SCORING_DEFAULTS = { strong_avg:4.5, strong_min:3, developing_avg:3.5, developing_min:2, several_avg:2.5 };

// Reads the editable thresholds from site-content.json. Any value that is
// missing, non-numeric, or outside 1–5 falls back to its default, and if the
// bands are out of order (strong must be >= developing >= several) all
// defaults are used, so a bad edit can never break the Snapshot.
function getScoring(){
  const raw = SITE_CONTENT.scoring || {};
  const sc = {};
  Object.keys(SCORING_DEFAULTS).forEach(k => {
    const n = Number(raw[k]);
    sc[k] = (raw[k] !== '' && raw[k] != null && isFinite(n) && n >= 1 && n <= 5) ? n : SCORING_DEFAULTS[k];
  });
  if (!(sc.strong_avg >= sc.developing_avg && sc.developing_avg >= sc.several_avg)) return { ...SCORING_DEFAULTS };
  return sc;
}

// pts: array of ten ratings (1–5), in question order. Pure function.
function computeSnapshot(pts, sc){
  sc = sc || getScoring();
  const n = pts.length;
  const sum = pts.reduce((s,p) => s + p, 0);
  const avg = Math.round((sum / n) * 1000) / 1000;
  const min = Math.min(...pts);
  const max = Math.max(...pts);

  let pattern;
  if (avg >= sc.strong_avg && min >= sc.strong_min) pattern = 'strong';
  else if (avg >= sc.developing_avg && min >= sc.developing_min) pattern = 'developing';
  else if (avg >= sc.several_avg) pattern = 'several';
  else pattern = 'foundational';

  // Area to examine: lowest rating; ties go to the earliest question.
  const area = pts.indexOf(min);

  // All ten identical: no meaningful strength/area split, so use the first
  // question purely as an example.
  if (min === max){
    return { avg, pattern, area: 0, strength: null, mode: 'all_equal' };
  }

  // Reported strength: highest rating excluding the area; ties go to the
  // earliest question; only shown when it is 4 or higher.
  let strength = null, best = -1;
  pts.forEach((p, i) => { if (i !== area && p > best){ best = p; strength = i; } });
  if (best < 4) strength = null;

  const mode = min >= 4 ? 'all_high' : (strength === null ? 'no_strength' : 'normal');
  return { avg, pattern, area, strength, mode };
}

function fill(tpl, vars){
  return String(tpl == null ? '' : tpl).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
}

function behaviorName(i){ return QUESTIONS[i].title.replace(/^\d+\.\s*/, ''); }
function currentPts(){ return answers.map(a => SCALE[a].pts); }

// Ordered pieces of the Snapshot, shared by the on-screen view and the email.
function snapshotParts(r){
  const s = SITE_CONTENT.snapshot || {};
  const sel = i => fill(s.selected_line, { behavior: behaviorName(i), answer: SCALE[answers[i]].label });
  const parts = [{ type:'pattern', intro: s.pattern_intro, name: s['pattern_' + r.pattern] }];

  if (r.mode === 'all_equal'){
    parts.push({ type:'note', text: s.equal_note });
    parts.push({ type:'block', label: s.equal_example_label, text: sel(0) });
    parts.push({ type:'block', label: s.question_label, text: QUESTIONS[0].prompt });
    parts.push({ type:'note', text: s.equal_next });
    return parts;
  }

  if (r.strength !== null) parts.push({ type:'block', label: s.strength_label, text: sel(r.strength) });
  else if (r.mode === 'no_strength') parts.push({ type:'note', text: s.no_strength_note });

  const allHigh = r.mode === 'all_high';
  parts.push({ type:'block', label: allHigh ? s.area_label_validate : s.area_label, text: sel(r.area) });
  parts.push({ type:'block', label: s.why_label, text: allHigh ? s.why_all_high : QUESTIONS[r.area].implication });
  parts.push({ type:'block', label: s.question_label, text: QUESTIONS[r.area].prompt });
  return parts;
}

function renderSnapshot(){
  if (!snapshotResult) snapshotResult = computeSnapshot(currentPts());
  const body = document.getElementById('snapBody');
  body.textContent = '';
  const el = (cls, text, tag) => { const e = document.createElement(tag || 'div'); e.className = cls; e.textContent = text; return e; };
  snapshotParts(snapshotResult).forEach(p => {
    if (p.type === 'pattern'){
      const box = el('snap-pattern', '');
      box.appendChild(el('snap-label', p.intro));
      box.appendChild(el('snap-pattern-name', p.name));
      body.appendChild(box);
    } else if (p.type === 'note'){
      body.appendChild(el('snap-note', p.text, 'p'));
    } else {
      const box = el('snap-block', '');
      box.appendChild(el('snap-label', p.label + ':'));
      box.appendChild(el('snap-text', p.text));
      body.appendChild(box);
    }
  });
}

function escHtml(t){
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Inline-styled HTML for the emailed copy: the same saved result shown on
// screen, plus the respondent's own ten self-ratings.
function snapshotEmailHtml(r){
  const s = SITE_CONTENT.snapshot || {};
  const f = 'font-family:Arial,Helvetica,sans-serif;';
  let h = `<div style="${f}color:#1d2b24;max-width:640px;">`;
  h += `<h2 style="${f}font-size:20px;margin:0 0 16px;">${escHtml(s.title)}</h2>`;
  snapshotParts(r).forEach(p => {
    if (p.type === 'pattern'){
      h += `<div style="background:#eaf5ee;border-radius:6px;padding:14px 16px;margin:0 0 18px;"><div style="font-size:14px;color:#1f5a3a;">${escHtml(p.intro)}</div><div style="font-size:20px;font-weight:bold;color:#1f5a3a;margin-top:4px;">${escHtml(p.name)}</div></div>`;
    } else if (p.type === 'note'){
      h += `<p style="${f}font-size:15px;color:#4a5a52;margin:0 0 18px;">${escHtml(p.text)}</p>`;
    } else {
      h += `<div style="margin:0 0 18px;"><div style="font-size:12px;font-weight:bold;text-transform:uppercase;color:#4a5a52;margin-bottom:4px;">${escHtml(p.label)}:</div><div style="font-size:15px;">${escHtml(p.text)}</div></div>`;
    }
  });
  h += `<p style="${f}font-size:14px;color:#4a5a52;margin:22px 0 0;padding-top:14px;border-top:1px dashed #cfd8d2;">${escHtml(s.closing)}</p>`;
  h += `<h3 style="${f}font-size:15px;margin:24px 0 6px;">${escHtml(s.email_ratings_heading)}</h3>`;
  h += `<p style="${f}font-size:13px;color:#4a5a52;margin:0 0 8px;">${escHtml(s.email_ratings_note)}</p>`;
  h += `<table style="border-collapse:collapse;width:100%;${f}font-size:14px;">`;
  QUESTIONS.forEach((q, i) => {
    h += `<tr><td style="border:1px solid #cfd8d2;padding:8px 10px;">${escHtml(behaviorName(i))}</td><td style="border:1px solid #cfd8d2;padding:8px 10px;white-space:nowrap;">${escHtml(SCALE[answers[i]].label)}</td></tr>`;
  });
  h += `</table>`;
  h += `<p style="${f}font-size:12px;color:#6b7a72;margin:20px 0 0;">${escHtml(s.disclaimer)}</p></div>`;
  return h;
}

function newId(){
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (_) {}
  return 'qc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

// Result fields included in the lead payload.
function resultFields(){
  const r = snapshotResult;
  const pts = currentPts();
  const flat = {};
  pts.forEach((p, i) => { flat['rating_' + (i + 1)] = p; });
  return {
    completion_id: completionId,
    average_score: (pts.reduce((s,p) => s + p, 0) / pts.length).toFixed(1),
    ...flat,
    overall_pattern: (SITE_CONTENT.snapshot || {})['pattern_' + r.pattern] || r.pattern,
    area_to_examine: behaviorName(r.area),
    reported_strength: r.strength === null ? '' : behaviorName(r.strength),
    source: 'Cost Control Behaviors QuickCheck'
  };
}

// Content-Type is deliberately 'text/plain', not 'application/json': JSON
// would trigger a CORS preflight (OPTIONS) that the webhook may not answer, so
// the real POST would never go out. text/plain is a CORS "simple request";
// the webhook still parses the body as JSON.
function postJson(url, payload, label){
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload),
    keepalive: true
  }).catch(err => { console.error('QuickCheck ' + label + ' POST failed:', err); });
}

function sendLead(){
  if (!LEAD_ENDPOINT || LEAD_ENDPOINT.indexOf('REPLACE_WITH') === 0) return Promise.resolve();
  const ratings = QUESTIONS.map((q,i) => ({ behavior: behaviorName(i), rating: SCALE[answers[i]].pts }));
  const payload = {
    event: 'lead',
    ...respondent,
    ratings, // array kept for compatibility; rating_1..rating_10 below are the unambiguous per-column fields
    ...resultFields(),
    report_html: snapshotEmailHtml(snapshotResult)
  };
  return postJson(LEAD_ENDPOINT, payload, 'lead');
}
